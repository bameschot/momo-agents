[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "token-report"
version = "0.1.0"
description = "CLI tool to aggregate agent token usage logs and generate an HTML report"
authors = [{name = "Momo Agents", email = "dev@momo-agents.local"}]
requires-python = ">=3.8"
# No runtime dependencies — pure stdlib

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
