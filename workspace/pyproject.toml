[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-report"
version = "0.1.0"
description = "CLI tool to generate an HTML token-usage report from agent JSONL logs"
requires-python = ">=3.8"
# No runtime dependencies — pure stdlib

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
token-report = "token_report:main"

[tool.setuptools]
py-modules = ["token_report"]

# ---------------------------------------------------------------------------
# Ruff configuration
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long — handled by formatter
    "UP006",  # require `list` instead of `List` — incompatible with Python 3.8
    "UP045",  # require `X | None` instead of `Optional[X]` — incompatible with Python 3.8
]

[tool.ruff.lint.isort]
known-first-party = ["token_report"]

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
